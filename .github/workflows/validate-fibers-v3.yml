name: Validate Soran Fibers V3

on:
  pull_request:
    paths:
      - 'textbook/pages/basics/fibers.html'
      - 'scripts/validate-fibers-v3.cjs'
      - '.github/workflows/validate-fibers-v3.yml'
  push:
    branches: [main]
    paths:
      - 'textbook/pages/basics/fibers.html'
      - 'scripts/validate-fibers-v3.cjs'
      - '.github/workflows/validate-fibers-v3.yml'

permissions:
  contents: read

jobs:
  fibers-content-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check V3 quizzes and inline scripts
        run: node scripts/validate-fibers-v3.cjs

  fibers-layout-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check responsive layout in real Chromium
        run: node scripts/test-fibers-layout.cjs
      - name: Keep screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fibers-layout-screenshots
          path: artifacts/fibers-layout/
          if-no-files-found: ignore
